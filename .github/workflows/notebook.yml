name: notebook

# Re-runs the whole notebook from scratch on every push, so a broken cell gets caught straight away
on:
  push:
  pull_request:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: jupyter nbconvert --to notebook --execute fuel_prices_analysis.ipynb --output /tmp/checked.ipynb
